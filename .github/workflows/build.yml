name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile Dylib with Clang
      run: |
        xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -miphoneos-version-min=15.0 -dynamiclib AudioHookBridge.m -framework Foundation -framework AudioToolbox -framework UIKit -install_name @rpath/libAudioHookBridge.dylib -o libAudioHookBridge.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libAudioHookBridge
        path: libAudioHookBridge.dylib
